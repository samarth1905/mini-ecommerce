<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 700">
    <defs>
      <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#e5e7eb"/>
        <stop offset="1" stop-color="#ffffff"/>
      </linearGradient>
      <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
        <feDropShadow dx="0" dy="14" stdDeviation="18" flood-opacity=".12"/>
      </filter>
    </defs>
    <rect width="700" height="700" rx="36" fill="url(#bg)"/>
    <text x="350" y="625" text-anchor="middle" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="#1f2937">Silver Ring</text>
    <text x="350" y="658" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#6b7280">Jewelry</text>
    <g filter="url(#shadow)" fill="none" stroke="#9ca3af" stroke-width="32">
          <circle cx="350" cy="330" r="120"/>
          <circle cx="350" cy="330" r="78" stroke="#d1d5db" stroke-width="12"/>
        </g></svg>