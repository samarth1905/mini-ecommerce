<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MiniStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container nav">
            <a href="index.html" class="logo">MiniStore</a>
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search products...">
            </div>
            <button class="cart-btn" id="cartBtn">Cart <span id="cartCount">0</span></button>
        </div>
    </header>

    <main>
        <section class="hero">
            <div class="container">
                <h1>Shop Our Products</h1>
                <p>Simple shopping, all in one place.</p>
            </div>
        </section>

        <section class="products-section">
            <div class="container">
                <div class="filter-row">
                    <select id="categoryFilter">
                        <option value="all">All Categories</option>
                    </select>
                    <select id="sortFilter">
                        <option value="default">Sort By</option>
                        <option value="low-high">Price: Low to High</option>
                        <option value="high-low">Price: High to Low</option>
                    </select>
                    <button id="clearFilters" class="clear-btn">Clear Filters</button>
                </div>

                <div id="loading" class="message">Loading products...</div>
                <div id="error" class="message error-message">Something went wrong while loading products.</div>
                <div id="empty" class="message">No products found.</div>
                <div id="productGrid" class="product-grid"></div>
            </div>
        </section>
    </main>

    <div id="cartOverlay" class="cart-overlay">
        <div class="cart">
            <div class="cart-header">
                <h2>Shopping Cart</h2>
                <button id="closeCart">&times;</button>
            </div>
            <div id="cartItems"></div>
            <div class="cart-footer">
                <div class="subtotal">
                    <span>Subtotal</span>
                    <strong>₹<span id="cartTotal">0.00</span></strong>
                </div>
                <button class="checkout-btn">Checkout</button>
            </div>
        </div>
    </div>

    <script src="js/cart.js"></script>
    <script src="js/products.js"></script>
</body>
</html>
